name: stamp-plugin-version

# LOAD-BEARING: colleagues only get an update when the plugin's version changes, and a merged map
# skill change doesn't change it (the publish script stamps only its own publishes). Remove this
# and merged map skill updates stop reaching people, with no error anywhere.
on:
  push:
    branches: [main]
    paths: ["plugins/ocha-bdu/skills/ocha-mapping/**"]

permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      # A deploy key, not the workflow's own token: the rules on main refuse direct pushes, and the
      # deploy key is the only automation they let through. To replace it: make a new key pair, add
      # the public half under the repo's Deploy keys (write access), the private half as this secret.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.STAMP_DEPLOY_KEY }}
      - run: python3 .github/scripts/stamp_plugin_version.py .
      - name: Commit the new version
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Stamp plugin version after a map skill update"
          git push origin main
